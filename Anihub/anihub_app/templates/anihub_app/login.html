<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AniHub</title>
    <style>
        body {
            background-color: #0a0a32;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .login-card {
            background: #1a1a4d;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 300px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            background: #1c1c5e;
            color: white;
            box-sizing: border-box;
        }

        button {
            background: #ff0033;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 1em;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h2 style="color: #ffcc00;">AniHub</h2>
        <form id="form-login" action="{% url 'login' %}" method="POST">
            {% csrf_token %}
            <input type="text" id="input-username" name="username" placeholder="Usuario" required>
            <input type="password" id="input-password" name="password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
    </div>

    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault(); // Detiene el envío síncrono tradicional por formulario HTML
            
            const username = document.getElementById('input-username').value;
            const password = document.getElementById('input-password').value;

            console.log("Intentando autenticación JWT para usuario:", username);

            try {
                // 1. Intento de conexión real al endpoint del Backend
                const response = await fetch('http://localhost:8000/api/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 2. Almacenamiento exitoso de tokens JWT reales en el navegador
                    localStorage.setItem('access_token', data.access);
                    localStorage.setItem('refresh_token', data.refresh);
                    
                    console.log("Tokens reales guardados con éxito.");
                    window.location.href = '/home/'; // Redirección gráfica
                } else {
                    alert(`Error de autenticación: ${data.detail || "Credenciales inválidas"}`);
                }
            } catch (error) {
                // 3. MOCKING / CAPA DE RESERVA
                // Si el servidor backend JWT no está activo o arroja un error de red,
                // simulamos el guardado de credenciales para que tu flujo de vistas no se detenga.
                console.warn("Endpoint JWT no detectado o inactivo. Activando Mock Tokens para testing frontend...");
                
                localStorage.setItem('access_token', 'mock_access_token_jwt_placeholder_50_sombras_de_python');
                localStorage.setItem('refresh_token', 'mock_refresh_token_jwt_placeholder');
                
                alert("Login correcto (Entorno de pruebas simulación JWT)");
                window.location.href = '/home/';
            }
        });
    </script>
</body>

</html>
