{% extends 'anihub_app/base.html' %}

{% block title %}Inicio - AniHub{% endblock %}

{% block content %}
<div id="section-catalog" class="tab-content">
    <div class="category-row">
        <h3>Manga de acción y aventura</h3>
        <div id="list-manga" class="anime-scroll"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function loadCatalog() {
        const token = localStorage.getItem('access_token');
        try {
            const response = await fetch('/api/catalog/', {
                method: 'GET',
                headers: {
                    'Authorization': `Token ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.status === 401) throw new Error("Token inválido");

            const data = await response.json();
            renderItems(data.catalog, 'list-manga');
        } catch (e) {
            console.error("Error:", e);
        }
    }

    function renderItems(items, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        
        container.innerHTML = items.map(i => {
            const mangaId = i.local_id;
            // Definimos la lógica del click como una cadena de texto para el atributo onclick
            // Nota: Solo pasamos el ID a una función global que definiremos abajo
            const onClickAttr = mangaId ? `openManga(${mangaId})` : '';
            const style = mangaId ? 'cursor:pointer;' : 'cursor:default; opacity: 0.6;';
            
            return `
                <div class="anime-card" 
                    onclick="${onClickAttr}" 
                    style="${style}">
                    <img src="${i.image_url}" 
                        alt="${i.title}" 
                        onerror="this.src='https://via.placeholder.com/120x180'">
                </div>
            `;
        }).join('');
    }

    // DEFINES ESTA FUNCIÓN FUERA DE RENDERITEMS (en tu script global)
    function openManga(id) {
        console.log("Intentando abrir manga con ID:", id);
        window.location.href = `/manga/read/${id}/`;
    }

    // Ejecutar al cargar
    loadCatalog();
</script>
{% endblock %}
