{% extends 'anihub_app/base.html' %}

{% block title %}Foro de la Comunidad - AniHub{% endblock %}

{% block extra_css %}
<style>
    .post-card { background: var(--bg-card); padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid var(--primary-red); animation: fadeIn 0.3s; }
    .post-user { color: var(--accent); font-weight: bold; font-size: 0.85em; display: block; margin-bottom: 5px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
{% endblock %}

{% block content %}
<div id="section-forum" style="padding: 20px;">
    <h2 style="color: var(--accent);">Foro de la Comunidad</h2>
    <div style="background: #161640; padding: 15px; border-radius: 15px; margin-bottom: 20px;">
        <textarea id="post-text" placeholder="¿Qué piensas de Steel Ball Run?" style="width: 100%; background: transparent; color: white; border: none; outline: none; resize: none; font-size: 1em;"></textarea>
        <div style="text-align: right; margin-top: 10px;">
            <button onclick="submitPost()" style="background: var(--primary-red); color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: bold;">Publicar Post</button>
        </div>
    </div>
    <div id="posts-container"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function submitPost() {
        const textarea = document.getElementById('post-text');
        const text = textarea.value;
        if(!text.trim()) return;

        const container = document.getElementById('posts-container');
        const newPost = `
            <div class="post-card">
                <span class="post-user">@Anonimo_Shinsoka</span>
                <p style="margin:0;">${text}</p>
            </div>
        `;
        container.innerHTML = newPost + container.innerHTML;
        textarea.value = '';
    }
</script>
{% endblock %}
