version: "3.9"

services:
  web:
    build: .
    container_name: django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/anihub
    ports:
      - "8000:8000"
    environment:
      - AES_SECRET_KEY=12345678901234567890123456789012 # La que pusiste en settings
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      - POSTGRES_DB=anihub_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres