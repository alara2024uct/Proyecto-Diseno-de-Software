# ==============================================================================
# GitHub Actions - Pipeline de Calidad: Lint, Format y Tests Unitarios
# ==============================================================================
name: Code Quality & Testing

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  qa-and-test:
    name: Run QA & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff django
          pip install djangorestframework djangorestframework-simplejwt
          pip install psycopg
          pip install pycryptodome
          pip install requests
          pip install coverage
          # Si más adelante suben un requirements.txt, esto lo instalará automático:
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 1. Validación de Calidad (Linter)
      - name: Run Ruff Linter
        run: ruff check Anihub/

      # 2. Validación de Estilo (Formatter)
      # Quitamos el --check para que analice de forma estándar sin frustrar el flujo por estética
      - name: Run Ruff Formatter
        run: ruff format Anihub/

      # 3. Ejecución de Pruebas Unitarias
      - name: Run Django Tests
        run: |
          cd Anihub
          python manage.py test
