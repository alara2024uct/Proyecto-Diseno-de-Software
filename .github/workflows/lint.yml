# ==============================================================================
# GitHub Actions - Pipeline de Calidad: Lint, Format y Tests Unitarios
# ==============================================================================
name: Code Quality & Testing

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  qa-and-test:
    name: Run QA & Unit Tests
    runs-on: ubuntu-latest

    # --------------------------------------------------------------------------
    # CONTENEDORES DE SERVICIO (Levanta Postgres en la máquina virtual de GitHub)
    # --------------------------------------------------------------------------
    services:
      db: # Este nombre crea el host de red 'db', coincidiendo con tu settings.py
        image: postgres:15
        env:
          POSTGRES_DB: anihub_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Garantiza que el paso de testing no inicie hasta que Postgres responda
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff django
          pip install djangorestframework djangorestframework-simplejwt
          pip install psycopg
          pip install pycryptodome
          pip install requests
          pip install coverage
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 1. Validación de Calidad (Linter)
      - name: Run Ruff Linter
        run: ruff check Anihub/

      # 2. Validación de Estilo (Formatter)
      - name: Run Ruff Formatter
        run: ruff format Anihub/

      # 3. Ejecución de Pruebas Unitarias
      - name: Run Django Tests
        run: |
          cd Anihub
          python manage.py test